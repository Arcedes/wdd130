<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="A basic HTML and CSS quiz that tests knowledge of CSS terminology, selectors, comments, and margin shorthand.">
    <meta name="author" content="Josue Canales Tecuatl">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form action="#" method="post">
            <div class="form-item">
                <label for="q1">
                    <span class="question-number">1.</span>
                    What does the acronym CSS stand for?
                </label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">
                    <span class="question-number">2.</span>
                    How are <code>id</code> and <code>class</code> attributes selected in CSS?
                </label>
                <textarea id="q2" name="q2" rows="5" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">
                    <span class="question-number">3.</span>
                    Which of the following is a valid CSS comment?
                </label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="html-comment">&lt;!-- CSS comment --&gt;</option>
                    <option value="slash-comment">// CSS comment</option>
                    <option value="css-comment">/* CSS comment */</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">
                    <span class="question-number">4.</span>
                    What is the bottom margin, in pixels, given this declaration?
                </label>
                <pre><code>margin: 10px 5px 15px;</code></pre>
                <input type="number" id="q4" name="q4" min="0" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
